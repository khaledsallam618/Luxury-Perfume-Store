<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Luxury Perfume</title>
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="icon" href="kj_logo.icon.webp">
    <script src="javascript.js"></script>
    <style>
        .contact-box {
            max-width: 550px;
            margin: 50px auto;
            background: transparent;
            border: 2px solid var(--color-gray-mid);
            border-radius: var(--radius-md);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 35px 30px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        .contact-box h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--color-black);
            font-weight: 700;
        }

        .contact-box p.subtitle {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-black);
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            font-family: var(--font-main);
            color: var(--color-black);
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--color-black);
            background: rgba(255, 255, 255, 0.95);
        }

        textarea.input-field {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--color-black);
            color: var(--color-white);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--color-white);
            color: var(--color-black);
            outline: 2px solid var(--color-black);
        }

        #statusMessage {
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px;
            border-radius: var(--radius-sm);
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Luxury Perfume</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Perfumes</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="Cart.html">Cart <span id="cartCount" class="cart-badge">0</span></a>
            <a href="menu.html">Menu</a>
        </nav>
    </header>

    <main>
        <div class="contact-box fade-in">
            <h2>Contact Us</h2>
            <p class="subtitle">Have any questions or need fragrance advice? Send us a message and we will get back to
                you shortly.</p>

            <form action="https://formspree.io/f/xyezwzvb" method="POST" id="contactForm">
                <div class="form-group">
                    <label for="contact-name">Full Name</label>
                    <input type="text" id="contact-name" name="name" class="input-field"
                        placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="contact-email">Email Address</label>
                    <input type="email" id="contact-email" name="email" class="input-field"
                        placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" class="input-field"
                        placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">Send Message</button>
            </form>

            <div id="statusMessage"></div>
        </div>
    </main>

    <footer>
        <p>© 2026 Luxury Perfume. All rights reserved.</p>
        <p style="margin-top: 8px; font-size: 0.85rem;">
            <a href="privacy.html" style="color: #555; text-decoration: underline; margin: 0 10px;">Privacy Policy</a> |
            <a href="returns.html" style="color: #555; text-decoration: underline; margin: 0 10px;">Shipping &
                Returns</a>
        </p>
    </footer>

    <script>
        const form = document.getElementById("contactForm");
        const status = document.getElementById("statusMessage");
        const submitBtn = document.getElementById("submitBtn");

        async function handleSubmit(event) {
            event.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending...";

            const data = new FormData(event.target);

            try {
                const response = await fetch(event.target.action, {
                    method: form.method,
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    status.style.display = "block";
                    status.style.color = "#155724";
                    status.style.background = "rgba(212, 237, 218, 0.7)";
                    status.innerHTML = "Thank you! Your message has been sent successfully.";
                    form.reset();
                } else {
                    const result = await response.json();
                    status.style.display = "block";
                    status.style.color = "#721c24";
                    status.style.background = "rgba(248, 215, 218, 0.7)";
                    status.innerHTML = result.errors ? result.errors.map(e => e.message).join(", ") : "Oops! There was a problem submitting your message.";
                }
            } catch (error) {
                status.style.display = "block";
                status.style.color = "#721c24";
                status.style.background = "rgba(248, 215, 218, 0.7)";
                status.innerHTML = "Oops! Network error, please try again later.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Message";
            }
        }

        form.addEventListener("submit", handleSubmit);
    </script>
</body>

</html>
