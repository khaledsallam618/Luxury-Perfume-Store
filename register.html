<!DOCTYPE html>
<html lang="en" dir="ltr">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Luxury Perfume</title>
<link rel="stylesheet" href="stylesheet.css">
<script src="javascript.js"></script>
<link rel="icon" href="kj_logo.icon.webp">
<style>
    .auth-box {
        max-width: 450px;
        margin: 50px auto;
        background: transparent;
        border: 2px solid var(--color-gray-mid);
        border-radius: var(--radius-md);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 35px 30px;
        box-shadow: var(--shadow-md);
    }

    .auth-box h2 {
        text-align: center;
        color: var(--color-black);
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
    }

    .form-group label {
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--color-black);
        font-size: 0.95em;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="password"] {
        width: 100%;
        height: 45px;
        background: transparent;
        border: none;
        border-bottom: 2px solid var(--color-black);
        outline: none;
        font-size: 1em;
        color: var(--color-black);
        font-weight: 600;
        padding: 0 5px;
        box-sizing: border-box;
        transition: var(--transition-fast);
    }

    .show-pass-box {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        cursor: pointer;
    }

    .show-pass-box input {
        cursor: pointer;
        width: 16px;
        height: 16px;
        accent-color: var(--color-black);
    }

    .show-pass-box label {
        cursor: pointer;
        margin: 0;
        font-size: 0.9em;
        color: var(--color-black);
    }

    .auth-btn {
        width: 100%;
        height: 50px;
        background: var(--color-black);
        color: var(--color-white);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1.1em;
        font-weight: 600;
        margin-top: 20px;
        transition: 0.4s;
    }

    .auth-btn:hover {
        background: var(--color-white);
        color: var(--color-black);
        outline: 2px solid var(--color-black);
    }

    .auth-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .switch-link {
        text-align: center;
        margin-top: 20px;
        font-size: 0.95rem;
        color: var(--color-black);
    }

    .switch-link a {
        color: var(--color-black);
        font-weight: bold;
        text-decoration: underline;
    }
</style>
</head>

<body>

    <header>
        <h1>Luxury Perfume</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Perfumes</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="cart.html">Cart <span id="cartCount" class="cart-badge">0</span></a>
            <a href="menu.html">Menu</a>
        </nav>
    </header>

    <div class="container fade-in">
        <div class="auth-box">
            <h2>Create a new account</h2>

            <form id="regForm">
                <div class="form-group">
                    <label for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" required placeholder="Full Name">
                </div>

                <div class="form-group">
                    <label for="regEmail">E-mail</label>
                    <input type="email" id="regEmail" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" minlength="6" required placeholder="••••••••">

                    <div class="show-pass-box">
                        <input type="checkbox" id="showRegPass" onchange="toggleRegPassword()">
                        <label for="showRegPass">Show Password</label>
                    </div>
                </div>

                <button type="submit" class="auth-btn" id="regSubmitBtn">Sign Up</button>
            </form>

            <div class="switch-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Luxury Perfume. All rights reserved.</p>
        <p style="margin-top: 8px; font-size: 0.85rem;">
            <a href="privacy.html" style="color: #555; text-decoration: underline; margin: 0 10px;">Privacy Policy</a> |
            <a href="returns.html" style="color: #555; text-decoration: underline; margin: 0 10px;">Shipping &
                Returns</a>
        </p>
    </footer>

    <script>
        function toggleRegPassword() {
            const passInput = document.getElementById('regPassword');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('regForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const btn = document.getElementById('regSubmitBtn');

            if (!fullName || !email || !password) {
                alert("يرجى ملء جميع الحقول المطلوبة.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "جاري التسجيل...";

            try {
                const response = await fetch('http://localhost:5000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    alert(data.message || "تم إنشاء الحساب بنجاح!");
                    window.location.href = "login.html";
                } else {
                    alert(data.message || "فشل إنشاء الحساب.");
                    btn.disabled = false;
                    btn.innerText = "הרשם עכשיו";
                }
            } catch (err) {
                console.error("Register Error:", err);
                alert("تعذر الاتصال بالسيرفر! تأكد من تشغيل node server.js في الـ Terminal.");
                btn.disabled = false;
                btn.innerText = "הרשם עכשיו";
            }
        });
    </script>
</body>

</html>
